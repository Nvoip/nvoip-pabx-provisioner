name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Validation-only package version
        required: true
        type: string
        default: 0.0.0-ci

jobs:
  package:
    runs-on:
      - codebuild-nvoip-ci-public-release-${{ github.run_id }}-${{ github.run_attempt }}
      - organization-registration-name:Nvoip
      - registration-group-id:4
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install RPM tooling
        run: sudo apt-get update && sudo apt-get install -y rpm gnupg
      - name: Build packages
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          VALIDATION_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${RELEASE_TAG:-$VALIDATION_VERSION}"
          VERSION="${VERSION#v}" sh scripts/package.sh
      - name: Sign RPM packages
        env:
          NVOIP_RPM_GPG_PRIVATE_KEY: ${{ secrets.NVOIP_RPM_GPG_PRIVATE_KEY }}
          NVOIP_RPM_GPG_KEY_ID: ${{ secrets.NVOIP_RPM_GPG_KEY_ID }}
        run: |
          if [ -z "$NVOIP_RPM_GPG_PRIVATE_KEY" ] || [ -z "$NVOIP_RPM_GPG_KEY_ID" ]; then
            echo "RPM signing secrets are not configured; skipping RPM signing."
            exit 0
          fi
          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg
          printf '%s\n' "$NVOIP_RPM_GPG_PRIVATE_KEY" | gpg --batch --import
          printf '%%_signature gpg\n' > ~/.rpmmacros
          printf '%%_gpg_name %s\n' "$NVOIP_RPM_GPG_KEY_ID" >> ~/.rpmmacros
          printf '%%__gpg /usr/bin/gpg\n' >> ~/.rpmmacros
          rpmsign --addsign dist/*.rpm
          gpg --armor --export "$NVOIP_RPM_GPG_KEY_ID" > /tmp/nvoip-rpm-public.asc
          rpm --import /tmp/nvoip-rpm-public.asc
          rpm --checksig -v dist/*.rpm
      - name: Publish GitHub release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
